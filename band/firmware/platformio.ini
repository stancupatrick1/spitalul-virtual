; Spitalul Virtual BAND firmware - made by Stancu Patrick
; Build + upload over the watch's own USB-C port:   pio run -t upload
; (first upload: hold the side button while plugging in USB to force download mode)

[env:spitalul_virtual_band]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
    adafruit/Adafruit LIS3DH@1.3.0
    adafruit/Adafruit Unified Sensor@1.1.14
