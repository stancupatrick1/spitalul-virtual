# Builds the band firmware on every push; the .bin is kept as a workflow artifact.
name: Build

on:
  push:
    branches: [main]
    paths: ['band/firmware/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Band firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('band/firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d band/firmware
      - run: |
          mkdir -p out
          cp band/firmware/.pio/build/spitalul_virtual_band/firmware.bin out/spitalul-virtual-band-firmware.bin
      - uses: actions/upload-artifact@v4
        with: { name: band-firmware, path: out/ }
